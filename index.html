canvas{width:100vw;height:100dvh} .panel{box-shadow:none!important} .texts{display:none!important}

:root{color-scheme:dark;--white:#fff;--muted:rgba(255,255,255,.48)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select,summary{font:inherit}button,select{color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,select:focus-visible{outline:1px solid white;outline-offset:5px}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;background:#000}canvas.dragging{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(20px,3.3vw,44px);padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;align-items:start;justify-content:space-between;gap:24px}
.brand{font-size:10px;letter-spacing:.21em;font-weight:500;line-height:1.8}
h1{font-size:18px;letter-spacing:.24em;font-weight:400;margin:12px 0 0}.subtitle{font-size:10px;letter-spacing:.12em;margin-top:9px;color:var(--muted)}
.tag{font-size:10px;letter-spacing:.12em;text-align:right;line-height:1.8}.status-dot{width:4px;height:4px;border-radius:100%;background:#fff;display:inline-block;margin-right:7px;vertical-align:middle}
.top-actions{margin-top:13px;display:flex;justify-content:end;gap:14px;pointer-events:auto}.link{border:0;padding:0;background:transparent;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.7)}.link:hover{color:white}
footer{width:min(620px,100%);margin:0 auto;pointer-events:auto}.meter{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px;gap:20px}.angle{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:31px;font-weight:300;letter-spacing:-.035em;line-height:1}.stage{font-size:11px;letter-spacing:.19em;margin-bottom:4px;color:rgba(255,255,255,.72)}
.timeline{width:100%;position:relative}input[type=range]{--progress:0%;appearance:none;-webkit-appearance:none;display:block;width:100%;height:24px;margin:0;background:transparent;cursor:ew-resize;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:linear-gradient(to right,#fff var(--progress),rgba(255,255,255,.23) var(--progress))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;height:10px;width:10px;margin-top:-4.5px;border:1px solid white;border-radius:50%;background:black}
input[type=range]::-moz-range-track{height:1px;background:rgba(255,255,255,.3)}input[type=range]::-moz-range-progress{height:1px;background:white}input[type=range]::-moz-range-thumb{height:9px;width:9px;border:1px solid white;border-radius:50%;background:black}
.ticks{display:flex;justify-content:space-between;margin:2px 0 19px}.tick{border:0;background:none;padding:0;color:var(--muted);font-size:9px;font-family:ui-monospace,monospace}.tick:hover{color:white}
.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.32);background:#000;padding:11px 18px;border-radius:2px;font-size:11px;letter-spacing:.07em;min-height:38px;transition:border-color .2s}.btn:hover{border-color:white}.btn.primary{background:#fff;color:#000;border-color:white;min-width:112px}.btn.minor{padding-left:13px;padding-right:13px;color:rgba(255,255,255,.72)}
.status{font-size:10px;color:var(--muted);margin:14px 0 0;line-height:1.8;min-height:18px;letter-spacing:.03em}
details{pointer-events:auto;position:relative}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}

          owner[i]=0;start[i]=t;end[i]=t+.14;h.mass+=particles[i].radius**2;break;
        }
      }
    }
    const completed=Math.max(...end);
    return roamingCache[leg]={particles,cloud,start,end,completed,owner,hunters};
  }

  function textMorph(i,t,release,to){
    // Dense central dust with a sparse, irregular outer halo, as in the reference.
    const departure=release+rand(i,761)*.08;
    const duration=14+rand(i,762)*9;
    const travel=clamp((t-departure)/duration);
    // Start moving immediately, then ease continuously into the final ink.
    const finish=1-Math.pow(1-travel,2);
    const settle=finish*finish;
    const envelope=Math.sin(Math.PI*finish);
    const azimuth=rand(i,771)*TAU;
    const depth=rand(i,772)*2-1;
    const plane=Math.sqrt(1-depth*depth);
    const distance=scale*(.08+Math.pow(rand(i,773),2.7)*3.5);
    const seedAngle=rand(i,765)*TAU;
    const seedRadius=Math.sqrt(rand(i,766))*14;
    const startX=W/2+Math.cos(seedAngle)*seedRadius;
    const startY=H/2+Math.sin(seedAngle)*seedRadius;
    const burstX=Math.cos(azimuth)*plane*distance;
    const burstY=Math.sin(azimuth)*plane*distance;
    return {
      x:mix(startX,to.x,settle)+burstX*envelope,
      y:mix(startY,to.y,settle)+burstY*envelope,
      z:depth*distance*1.4*envelope,
      finish,departure
    };
  }
  function animationTime(progress,legEnd){
    const joined=legEnd-24;
    const leftSpeed=joined/.42,rightSpeed=24/.58;
    // Blend the speed change across aggregation and release instead of braking abruptly.
    const low=.36,high=.48;
    if(progress<=low)return progress*leftSpeed;
    if(progress>=high)return joined+(progress-.42)*rightSpeed;
    const span=high-low,u=(progress-low)/span;
    const start=low*leftSpeed,end=joined+(high-.42)*rightSpeed;
    return (2*u*u*u-3*u*u+1)*start+(u*u*u-2*u*u+u)*span*leftSpeed
      +(-2*u*u*u+3*u*u)*end+(u*u*u-u*u)*span*rightSpeed;
  }
  let pursuitPlaybackRate=1,filteredPlaybackRate=1;
  const TEXT_HOLD_SECONDS=1.5;
  let textHoldRemaining=0;
  function drawTextBubbles(){
    ctx.save();
    // The same clear spherical skin is used for the bubbles attached to ink.
    const placed=[];
    for(const a of textBubbleAnchors){
      if(!a.large||placed.length>=11)continue;
      const r=artWidth*(.048+rand(a.seed,4312)*.033);
      if(placed.some(b=>Math.hypot(b.x-a.x,b.y-a.y)<r*2.3))continue;
      placed.push(a);
      drawBubble({x:a.x+r*.23,y:a.y-r*.16,r,rotation:a.rotation,
        squeeze:1.04,depth:1,surfaceStrength:0,surfacePhase:0,contacts:[]});
    }
    ctx.restore();
  }

  function render(angle){
    if(!ready||lastPaint===angle)return;
    const a=cycle(angle),phase=a%180,leg=Math.floor(a/180);
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.lineCap='round';
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    bubbleScene=bubbleGeometry(a);prepareFoamContacts();
    const sorted=[...bubbleScene].sort((a,b)=>a.depth-b.depth);
    sorted.forEach(b=>drawBubble(b));
    const outgoing=phase<=90;
    const amount=outgoing?clamp((phase-23)/63):clamp((157-phase)/63);
    drawStrokes(outgoing?leg:1-leg,amount,!outgoing);
    // Near membranes bend across the transported ink; no alpha animation.
    for(const b of sorted)if(b.depth>.50)drawBubble(b,true);
    drawTextBubbles();
    coreState=bubbleScene;lastMeso=bubbleScene;
    pursuitPlaybackRate=1;lastPaint=angle;
  }
  const paint=render;
  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    if(ready){huntPaths=[null,null];mesoPlans=[null,null];rebuild();lastPaint=NaN;paint(current);}
  }
  function stage(p){
    const phase=(p*360)%180;
    if(phase<25||phase>=155)return '01 / 文字完整成形';
    if(phase<80)return '02 / 泡泡吞入筆畫';
    if(phase<100)return '03 / 泡泡推擠與重排';
    return '04 / 筆畫從接縫長出';
  }

  function updateUI() {
    $('angle').textContent=current.toFixed(1).padStart(5,'0')+'\u00b0';
    const displayed=Math.abs(current-360)<.02?360:cycle(current);
    $('angle').textContent=displayed.toFixed(1).padStart(5,'0')+'°';
    if(!scrubbing)$('scrub').value=displayed;
    $('scrub').style.setProperty('--progress',(displayed/3.6)+'%');
    $('stage').textContent=stage(cycle(current)/360);
    $('play').textContent=auto?UI.pause:UI.play;
    $('gyro').textContent=sensor?UI.gyroOff:UI.gyro;
    $('mode').textContent=sensor?UI.modeGyro:auto?UI.modeAuto:UI.modeManual;
  }
  function say(message) {$('status').textContent=message;}
  function detachSensor() {
    sensor=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;clearTimeout(timeoutID);
    window.removeEventListener('deviceorientation',onOrientation);
  }
  function manual(angle,immediate=false) {
    auto=false;textHoldRemaining=0;detachSensor();target=Number.isFinite(Number(angle))?Number(angle):0;
    if(immediate){current=target;vel=0;paint(current);}
    say(UI.manualHelp);updateUI();
  }
  function startAuto() {
    detachSensor();
    autoOrigin=current;autoBegin=performance.now();filteredPlaybackRate=pursuitPlaybackRate;
    textHoldRemaining=Math.abs(current/180-Math.round(current/180))<.00001?TEXT_HOLD_SECONDS:0;
    auto=true;
    say(UI.previewHelp);updateUI();
  }
  function tick(now) {
    const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
    if(auto) {
      // Match visible pursuit movement to the preceding roaming speed.
      filteredPlaybackRate=mix(filteredPlaybackRate,pursuitPlaybackRate*(1-.3*smooth(25,45,Math.min(cycle(current)%180,180-cycle(current)%180))),1-Math.exp(-14*dt));
      if(textHoldRemaining>0){
        textHoldRemaining=Math.max(0,textHoldRemaining-dt);
      }else{
        const boundary=direction>0?(Math.floor(target/180)+1)*180:(Math.ceil(target/180)-1)*180;
        // Slow the departure from each sentence, then ease back to normal speed.
        const departure=cycle(target*direction)%180;
        const breakupRate=mix(.5,1,smooth(15,25,departure));
        const next=target+dt*30*filteredPlaybackRate*breakupRate*direction;
        if(direction>0?next>=boundary:next<=boundary){
          target=boundary;current=boundary;vel=0;
          textHoldRemaining=TEXT_HOLD_SECONDS;
        }else target=next;
      }
    }
    // Analytic, critically damped spring. Frame-rate independent, no bouncing.
    if(sensor){
      // Sensor deltas have already been shortest-angle unwrapped. Filter the
      // continuous angle so 359 -> 0 never takes a full reverse turn.
      const textAngle=Math.round(target/180)*180;
      if(sensorTextAnchor!==null&&Math.abs(target-sensorTextAnchor)>3)sensorTextAnchor=null;
      if(sensorTextAnchor===null&&Math.abs(target-textAngle)<=1.5)sensorTextAnchor=textAngle;
      current=sensorTextAnchor!==null?sensorTextAnchor:mix(current,target,1-Math.exp(-dt/.055));
      vel=0;
      if(sensorTextAnchor===null&&Math.abs(current-target)<.025)current=target;
    }
    const omega=24,decay=Math.exp(-omega*dt),err=current-target;
    const t=(vel+omega*err)*dt;
    if(!sensor){current=target+(err+t)*decay;vel=(vel-omega*t)*decay;}

    if((!sensor||sensorTextAnchor===null)&&Math.abs(current-target)<.0005&&Math.abs(vel)<.005){current=target;vel=0;}
    frameStep=dt*60;paint(current);
    frameMS=frameMS*.97+dt*1000*.03;
    // Do not rebuild particle identities in the middle of a transition.
    if(now-lastUI>50){updateUI();lastUI=now;}
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click',()=>{
    if(auto){auto=false;target=current;vel=0;say(UI.paused);}else startAuto();
    updateUI();
  });
  $('reset').addEventListener('click',()=>{manual(0,true);say(UI.ready);});
  $('scrub').addEventListener('input',e=>manual(e.target.value));
  $('scrub').addEventListener('pointerdown',()=>{scrubbing=true;auto=false;detachSensor();});
  window.addEventListener('pointerup',()=>{scrubbing=false;});
  window.addEventListener('pointercancel',()=>{scrubbing=false;});
  document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>manual(Number(b.dataset.angle))));
  window.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('play').click();}
    else if(e.key==='ArrowRight'){e.preventDefault();manual(target+(e.shiftKey?15:3));}
    else if(e.key==='ArrowLeft'){e.preventDefault();manual(target-(e.shiftKey?15:3));}
    else if(e.key==='Home'){e.preventDefault();manual(0);}
    else if(e.key==='End'){e.preventDefault();manual(360);}
    else if(e.key==='Escape'){setClean(false);$('options').open=false;}
  });
  let dragging=false,dragX=0,dragAngle=0;
  canvas.addEventListener('pointerdown',e=>{manual(current);dragging=true;dragX=e.clientX;dragAngle=current;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
  canvas.addEventListener('pointermove',e=>{if(dragging)target=dragAngle+(e.clientX-dragX)*360/Math.max(280,W);});
  function dragEnd(){dragging=false;canvas.classList.remove('dragging');}
  canvas.addEventListener('pointerup',dragEnd);canvas.addEventListener('pointercancel',dragEnd);
  // W3C orientation order: Rz(alpha) * Rx(beta) * Ry(gamma).
  // Relative quaternion twist around the DEVICE Z axis tracks rotating the
  // phone like a dial, unlike alpha alone (which tracks the earth Z axis).
  const qNow=new Float64Array(4),qPrevious=new Float64Array(4);
  function onOrientation(e) {
    if(!sensor||!Number.isFinite(e.alpha)||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!sensorGotData){sensorGotData=true;clearTimeout(timeoutID);say(UI.sensorHelp);}
    let delta=0;
    if(sensorType==='heading'){
      const raw=e.alpha;
      if(rawHeading===null){rawHeading=raw;return;}
      delta=raw-rawHeading;rawHeading=raw;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
      // Heading unwrap: 359 -> 0 advances +1; 0 -> 359 retreats -1.
    }else{
      const a=e.alpha*DEG/2,b=e.beta*DEG/2,g=e.gamma*DEG/2;
      const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
      qNow[0]=ca*sb*cg-sa*cb*sg;qNow[1]=ca*cb*sg+sa*sb*cg;
      qNow[2]=ca*sb*sg+sa*cb*cg;qNow[3]=ca*cb*cg-sa*sb*sg;
      if(prevQ===null){qPrevious.set(qNow);prevQ=true;return;}
      let w=qPrevious[3]*qNow[3]+qPrevious[0]*qNow[0]+qPrevious[1]*qNow[1]+qPrevious[2]*qNow[2];
      let z=qPrevious[3]*qNow[2]-qPrevious[2]*qNow[3]-qPrevious[0]*qNow[1]+qPrevious[1]*qNow[0];
      // Measure each change in the previous device frame, then advance the baseline.
      qPrevious.set(qNow);
      if(w<0){w=-w;z=-z;}
      if(Math.hypot(w,z)<1e-8)return;
      delta=-2*Math.atan2(z,w)/DEG;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
    }
    // Reject a sensor restart/outlier, not normal wraparound.
    if(!Number.isFinite(delta)||Math.abs(delta)>55)return;
    // Unbounded accumulated sensor angle; wrap is handled in the delta above.
    accum+=delta*direction*sensitivity;
    target=accum;
  }
  async function enableGyro() {
    if(sensor){detachSensor();say(UI.manualHelp);updateUI();return;}
    auto=false;
    if(!window.isSecureContext){say(UI.needHTTPS);updateUI();return;}
    if(!('DeviceOrientationEvent' in window)){say(UI.noSensor);updateUI();return;}
    try {
      // Called directly by a user gesture: necessary for the iOS permission UI.
      if(typeof DeviceOrientationEvent.requestPermission==='function') {
        const result=await DeviceOrientationEvent.requestPermission();
        if(result!=='granted'){say(UI.denied);updateUI();return;}
      }
      sensor=true;sensorGotData=false;sensorTextAnchor=null;prevQ=null;rawHeading=null;
      accum=0;target=0;current=0;vel=0;paint(0);
      window.addEventListener('deviceorientation',onOrientation,{passive:true});
      say(UI.waitSensor);updateUI();
      timeoutID=setTimeout(()=>{
        if(!sensorGotData){detachSensor();say(UI.noData);updateUI();}
      },4500);
    }catch(err){detachSensor();say(UI.permissionError+' '+(err.message||''));updateUI();}
  }
  $('gyro').addEventListener('click',enableGyro);
  $('calibrate').addEventListener('click',()=>{
    accum=0;sensorTextAnchor=null;prevQ=null;rawHeading=null;target=0;current=0;vel=0;auto=false;paint(0);say(UI.calibrated);updateUI();
  });
  $('axis').addEventListener('change',e=>{
    sensorType=e.target.value;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;say(UI.axisChanged);
  });
  $('direction').addEventListener('change',e=>{direction=e.target.checked?-1:1;sensorTextAnchor=null;prevQ=null;rawHeading=null;accum=current;});
  $('sensitivity').addEventListener('change',e=>{sensitivity=Number(e.target.value);sensorTextAnchor=null;accum=current;});
  function setClean(on) {
    clean=on;document.body.classList.toggle('clean',on);
    $('restore').hidden=!on||lockedForCapture;
    resize();
  }
  $('clean').addEventListener('click',()=>setClean(true));
  $('restore').addEventListener('click',()=>setClean(false));
  $('fullscreen').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
        try{await screen.orientation.lock('portrait');}catch(_){/* optional */}
      }else if(document.fullscreenElement)await document.exitFullscreen();
      else say(UI.noFullscreen);
    }catch(_){say(UI.noFullscreen);}
  });
  document.addEventListener('visibilitychange',()=>{
    last=performance.now();prevQ=null;rawHeading=null;
    if(document.hidden){auto=false;target=current;vel=0;}
  });
  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120);},{passive:true});


  Object.assign(UI,{title:'為你好 / 選擇',subtitle:'轉到 180° 顯示第二句，360° 回到第一句。',gyro:'啟用旋轉感應',gyroOff:'停用旋轉感應',ready:'左右拖曳或滑動角度，轉動話語。',manualHelp:'左右拖曳或使用滑桿；反向操作可逐步還原。',paused:'預覽已暫停，泡泡停留在目前角度。'});
  document.querySelectorAll('[data-label]').forEach(el=>el.textContent=UI[el.dataset.label]||'');
  $('sourceText').textContent='';$('targetText').textContent='';
  document.title='透明球膜貼字｜為你好／選擇';
  document.querySelector('.brand').innerHTML='FOR YOUR OWN GOOD<br>CELLULAR MEMBRANE / 泡泡薄膜翻滾';
  canvas.setAttribute('aria-label','白色圓形粒子組成的選擇情境，拖曳可改變角度');
  $('scrub').setAttribute('aria-label','旋轉角度 0 至 360 度');
  document.querySelector('.sr-only').textContent='0° 你眼光也太差；180° 我怕你被傷害，整句倒置；360° 回到第一句。';
  window.vortex={setAngle:a=>manual(a,true),getStats:()=>({count:particles.length,angle:current,target,width:W,height:H,sensor,auto,quality,pursuitPlaybackRate}),getSource:()=>DATA,setClean,particles:()=>particles,cores:()=>coreState,middle:()=>lastMeso};
  window.vortex.ready=(async()=>{
    resize();
    say('正在準備粒子字形…');
    await Promise.race([document.fonts.load('700 90px "Noto Serif TC"','我們都決定好了你就該完成我的夢想'),new Promise(r=>setTimeout(r,3500))]).catch(()=>{});
    await Promise.all(glyphImages.map(im=>im.decode()));
    rebuild();
    ready=true;paint(current);say(UI.ready);updateUI();
    if(params.has('angle'))manual(Number(params.get('angle')),true);
    if(lockedForCapture)setClean(true);
    // Geometry uses embedded reference points and does not depend on font loading.
  })();
  requestAnimationFrame(tick);
})();
</script>
